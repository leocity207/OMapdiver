services:
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp.prod
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      ORM_HOST: oatpp-orm
      NODE_ENV: production
      ORIGIN: http://localhost:3000
    depends_on:
      oatpp-orm:
        condition: service_healthy

  oatpp-orm:
    build:
      context: .
      dockerfile: docker/Dockerfile.oatpp-orm.prod
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-appdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  json_loader:
    build:
      context: .
      dockerfile: docker/Dockerfile.loader
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: >
      python /app/loader/main.py
      --host db
      --port 5432
      --dbname ${POSTGRES_DB:-appdb}
      --user ${POSTGRES_USER:-appuser}
      --password ${POSTGRES_PASSWORD:-app_password}
      --data-root /app/data
    restart: "no"

volumes:
  db_data: