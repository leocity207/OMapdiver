name: E2E Test CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack + pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm -v

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            playwright-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps

      - name: Start full stack
        run: |
          docker compose up -d --build db oatpp-orm webapp
          
      - name: Wait for webapp to be ready
        run: |
          echo "Waiting for db to be healthy..."
          timeout 60 bash -c \
            'until docker compose ps db | grep -q "(healthy)"; do sleep 3; done'
          
          echo "Waiting for oatpp-orm to be ready..."
          timeout 60 bash -c \
            'until docker compose ps oatpp-orm | grep -q "running"; do sleep 3; done'
          
          echo "Waiting for webapp on port 3000..."
          timeout 60 bash -c \
            'until curl -sf http://localhost:3000; do sleep 3; done'
          
          echo "Waiting for /dyn/network_data..."
          timeout 60 bash -c \
            'until curl -sf http://localhost:3000/dyn/network_data; do sleep 3; done'

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Stop stack
        if: always()
        run: docker compose down

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7