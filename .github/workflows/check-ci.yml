stages:
  - quality

default:
  image: node:20-bookworm-slim
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store/

quality-check:
  stage: quality
  script:
    - pnpm install --frozen-lockfile
    - pnpm run check:svelte
    - pnpm run check:lint:dry_run
    - pnpm run check:prettier:dry_run
    - git diff --exit-code
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH