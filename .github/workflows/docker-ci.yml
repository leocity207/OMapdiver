name: Docker CI

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verify docker compose
        run: docker compose version

      - name: add submodule
        run: git submodule init && git submodule update

      - name: Build services
        run: docker compose build server