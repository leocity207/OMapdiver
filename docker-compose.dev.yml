services:
  webapp:
    build:
      context: .
      dockerfile: docker/Dockerfile.webapp.dev
    ports:
      - "3000:3000"
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      ORM_HOST: oatpp-orm
      CHOKIDAR_USEPOLLING: "true"
      CI: "true"
    volumes:
      - ./resources:/app/resources

  oatpp-orm:
    build:
      context: .
      dockerfile: docker/Dockerfile.oatpp-orm.dev
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-appdb}
      DB_USER: ${POSTGRES_USER:-appuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    develop:
      watch:
        - action: sync
          path: ./CMakeLists.txt
          target: /app/CMakeLists.txt
        - action: sync
          path: ./src
          target: /app/src

  db:
    image: postgres:${POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"

  json_loader:
    build:
      context: .
      dockerfile: docker/Dockerfile.loader
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    command: >
      python /app/loader/main.py
      --host db
      --port 5432
      --dbname ${POSTGRES_DB:-appdb}
      --user ${POSTGRES_USER:-appuser}
      --password ${POSTGRES_PASSWORD:-app_password}
      --data-root /app/data
    restart: "no"

volumes:
  db_data: